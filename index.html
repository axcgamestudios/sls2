<!DOCTYPE html>
<html xmlns='https://www.w3.org/1999/xhtml' lang='' xml:lang=''>
<head>
        <meta charset='utf-8' />
        <meta name='viewport' content='width=device-width, user-scalable=no' />
        <title>Super Liquid Soccer</title>
        <style type='text/css'>
                html, body {
                        touch-action: none;
                        margin: 0;
                        border: 0 none;
                        padding: 0;
                        text-align: center;
                        background-color: #0c3d1e;
                        overflow: hidden;
                        height: 100%;
                }

                body::before {
                        content: "";
                        position: fixed;
                        inset: 0;
                        background:
                                radial-gradient(ellipse at 50% 30%, rgba(56, 142, 78, 0.55) 0%, rgba(12, 61, 30, 0.92) 62%, rgba(5, 26, 13, 1) 100%);
                        z-index: -2;
                }

                #loading-brand {
                        position: fixed;
                        left: 0;
                        right: 0;
                        top: 26%;
                        z-index: 10;
                        visibility: hidden;
                        pointer-events: none;
                }

                #loading-brand h1 {
                        font-family: 'Verdana', 'Arial Black', sans-serif;
                        font-size: clamp(28px, 6vw, 64px);
                        color: #f5cd70;
                        letter-spacing: 1px;
                        text-transform: uppercase;
                        margin: 0;
                        text-shadow: 0 3px 0 #7a5b1c, 0 6px 14px rgba(0,0,0,0.55);
                }

                #loading-brand h2 {
                        font-family: 'Verdana', sans-serif;
                        font-size: clamp(11px, 1.6vw, 16px);
                        color: rgba(255,255,255,0.75);
                        font-weight: normal;
                        letter-spacing: 6px;
                        text-transform: uppercase;
                        margin: 10px 0 0;
                }

                #canvas {
                        display: block;
                        margin: 0 auto;
                        color: white;
                }

                #canvas:focus {
                        outline: none;
                }

                .godot {
                        font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
                        color: #e0e0e0;
                        background-color: #3b3943;
                        background-image: linear-gradient(to bottom, #403e48, #35333c);
                        border: 1px solid #45434e;
                        box-shadow: 0 0 1px 1px #2f2d35;
                }

                /* Status display
                 * ============== */

                #status {
                        position: absolute;
                        left: 0;
                        top: 0;
                        right: 0;
                        bottom: 0;
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        gap: 22px;
                        visibility: hidden;
                }

                #status-progress {
                        width: 380px;
                        max-width: 70vw;
                        height: 16px;
                        background-color: rgba(0, 0, 0, 0.55);
                        border: 2px solid rgba(245, 205, 112, 0.85);
                        border-radius: 12px;
                        padding: 3px;
                        box-shadow: 0 4px 18px rgba(0,0,0,0.5);
                        visibility: visible;
                        overflow: hidden;
                }

                @media only screen and (orientation:portrait) {
                        #status-progress {
                                width: 61.8%;
                        }
                }

                #status-progress-inner {
                        height: 100%;
                        width: 0;
                        box-sizing: border-box;
                        transition: width 0.4s ease;
                        background: linear-gradient(90deg, #f5cd70, #ffd98a 60%, #fff3c4);
                        border-radius: 8px;
                        box-shadow: 0 0 12px rgba(245, 205, 112, 0.65);
                }

                #status-indeterminate {
                        height: 42px;
                        visibility: visible;
                        position: relative;
                }

                #status-indeterminate > div {
                        width: 4.5px;
                        height: 0;
                        border-style: solid;
                        border-width: 9px 3px 0 3px;
                        border-color: #f5cd70 transparent transparent transparent;
                        transform-origin: center 21px;
                        position: absolute;
                }

                #status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
                #status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
                #status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
                #status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
                #status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
                #status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
                #status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
                #status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

                #status-notice {
                        margin: 0 100px;
                        line-height: 1.3;
                        visibility: visible;
                        padding: 6px 12px;
                        visibility: visible;
                        font-family: 'Verdana', sans-serif;
                        font-size: 13px;
                }
        </style>
        <!-- Poki SDK include -->
        <script src="patch/js/poki-sdk.js"></script>
        <script>
                window.addEventListener('keydown', ev => {
                        if (['ArrowDown', 'ArrowUp', ' '].includes(ev.key)) {
                                ev.preventDefault();
                        }
                });
                window.addEventListener('wheel', ev => ev.preventDefault(), { passive: false });
        </script>

<link id='-gd-engine-icon' rel='icon' type='image/png' href='index.icon.png' />
<link rel='apple-touch-icon' href='index.apple-touch-icon.png'/>
<link rel='manifest' href='index.manifest.json'>

        <script>
                //place sitelock code here.
        </script>

</head>
<body>
        <div id="loading-brand">
                <h1>Super Liquid Soccer</h1>
                <h2>Cargando el juego</h2>
        </div>
        <canvas id='canvas'>
                HTML5 canvas appears to be unsupported in the current browser.<br />
                Please try updating or use a different browser.
        </canvas>
        <div id='status'>
                <div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'><div id ='status-progress-inner'></div></div>
                <div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                </div>
                <div id='status-notice' class='godot' style='display: none;'></div>
        </div>

        <script type='text/javascript' src='index.js'></script>
        <script type='text/javascript'>//<![CDATA[

                const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":16008244,"index.wasm":13789463},"focusCanvas":true,"gdnativeLibs":[],"serviceWorker":"index.service.worker.js"};
                var engine = new Engine(GODOT_CONFIG);

                function startGameLoading() {
                        const INDETERMINATE_STATUS_STEP_MS = 100;
                        var statusProgress = document.getElementById('status-progress');
                        var statusProgressInner = document.getElementById('status-progress-inner');
                        var statusIndeterminate = document.getElementById('status-indeterminate');
                        var statusNotice = document.getElementById('status-notice');
                        var loadingBrand = document.getElementById('loading-brand');

                        var initializing = true;
                        var statusMode = 'hidden';

                        var animationCallbacks = [];
                        function animate(time) {
                                animationCallbacks.forEach(callback => callback(time));
                                requestAnimationFrame(animate);
                        }
                        requestAnimationFrame(animate);

                        function setStatusMode(mode) {

                                if (statusMode === mode || !initializing)
                                        return;
                                [statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
                                        elem.style.display = 'none';
                                });
                                animationCallbacks = animationCallbacks.filter(function(value) {
                                        return (value != animateStatusIndeterminate);
                                });
                                switch (mode) {
                                        case 'progress':
                                                statusProgress.style.display = 'block';
                                                break;
                                        case 'indeterminate':
                                                statusIndeterminate.style.display = 'block';
                                                animationCallbacks.push(animateStatusIndeterminate);
                                                break;
                                        case 'notice':
                                                statusNotice.style.display = 'block';
                                                break;
                                        case 'hidden':
                                                break;
                                        default:
                                                throw new Error('Invalid status mode');
                                }
                                statusMode = mode;
                        }

                        function animateStatusIndeterminate(ms) {
                                var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
                                if (statusIndeterminate.children[i].style.borderTopColor == '') {
                                        Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
                                                child.style.borderTopColor = '';
                                        });
                                        statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
                                }
                        }

                        function setStatusNotice(text) {
                                while (statusNotice.lastChild) {
                                        statusNotice.removeChild(statusNotice.lastChild);
                                }
                                var lines = text.split('\n');
                                lines.forEach((line) => {
                                        statusNotice.appendChild(document.createTextNode(line));
                                        statusNotice.appendChild(document.createElement('br'));
                                });
                        };

                        function displayFailureNotice(err) {
                                var msg = err.message || err;
                                console.error(msg);
                                setStatusNotice(msg);
                                setStatusMode('notice');
                                initializing = false;
                        };

                        if (!Engine.isWebGLAvailable()) {
                                displayFailureNotice('WebGL not available');
                        } else {
                                loadingBrand.style.visibility = 'visible';
                                setStatusMode('indeterminate');
                                PokiSDK.gameLoadingStart();
                                engine.startGame({
                                        'onProgress': function (current, total) {
                                                if (total > 0) {
                                                        statusProgressInner.style.width = current/total * 100 + '%';
                                                        setStatusMode('progress');
                                                        if (current === total) {
                                                                // wait for progress bar animation
                                                                setTimeout(() => {
                                                                        setStatusMode('indeterminate');
                                                                }, 500);
                                                        }
                                                } else {
                                                        setStatusMode('indeterminate');
                                                }
                                        },
                                }).then(() => {
                                        setStatusMode('hidden');
                                        initializing = false;
                                        loadingBrand.style.visibility = 'hidden';
                                        PokiSDK.gameLoadingFinished();
                                }, displayFailureNotice);
                        }
                }

                //Poki SDK Init.
                PokiSDK.init().then(()=>{
                        startGameLoading()
                }).catch(()=>{
                        startGameLoading()
                })

                let hn = window.location.hostname
                if(hn == "localhost" || hn == "192.168.1.14"){
                        PokiSDK.setDebug(true)
                }
//]]></script>
  <script src="js/analytics_ubg_v1_4.js"></script>
  <script src="js/ubg235_client_v1_2.js"></script>
  <script src="js/ubg98.js"></script>
</body>
</html>
